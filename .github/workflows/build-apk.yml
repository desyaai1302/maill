name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Auto-Detect Project Folder and Build APK
        run: |
          # Mencari di mana file gradlew berada secara otomatis
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Aduh! File gradlew tidak ditemukan di folder mana pun."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Proyek Anda ditemukan di dalam folder: $PROJECT_DIR"
          
          # Masuk ke folder proyek dan jalankan perakitan APK
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug -Djava.awt.headless=true --no-daemon
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: TugasQu-Ready-App
          path: "**/build/outputs/apk/debug/*.apk"
